# HTTP throughput regression tracker.
#
# On every push to main we boot `bench_server --reactor` and a
# matching nginx side-by-side on the same runner, hit both with wrk,
# and record RPS for /health, /json, /echo. The numbers are pushed
# through `benchmark-action/github-action-benchmark` which appends
# to `bench-data/http-bench.json` and flags regressions past
# `alert-threshold`.
#
# The CI runner (ubuntu-latest, 4 vCPU) will always be slower than
# a dev laptop; that's fine — the goal is trend tracking, not
# absolute RPS. Both lean-tea and nginx run under identical
# conditions on the same runner, so their ratio is meaningful even
# when the absolute number moves.

name: bench

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  deployments: write
  contents: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  http-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: elan default $(cat lean-toolchain)

      - name: Install nginx + wrk
        run: sudo apt-get update && sudo apt-get install -y nginx wrk

      # ---- Build the bench server ----

      - name: Build bench_server
        run: lake build bench_server

      # ---- Configure nginx to serve payloads matching our routes ----

      - name: Configure nginx (port 9090, /health + /json)
        run: |
          sudo tee /etc/nginx/sites-available/leanbench.conf > /dev/null << 'CONF'
          server {
            listen 9090 default_server reuseport backlog=1024;
            access_log off;
            keepalive_timeout 65;
            keepalive_requests 10000;
            location /health {
              return 200 'OK';
              default_type text/plain;
            }
            location /json {
              return 200 '{"ok":true,"count":42,"name":"lean-tea","status":"green","note":"bench"}';
              default_type application/json;
            }
          }
          CONF
          sudo ln -sf /etc/nginx/sites-available/leanbench.conf /etc/nginx/sites-enabled/leanbench.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx

      # ---- Benchmark: 3 lean-tea backends + nginx, 3 routes each ----
      #
      # We compare all three lean-tea HTTP backends against nginx so the
      # chart shows the tradeoffs directly:
      #   * libuv   — Std.Async.TCP, single accept loop (baseline)
      #   * fast    — POSIX FFI, thread-per-connection (SO_REUSEPORT)
      #   * reactor — single kqueue/epoll event loop (default)
      # 8 wrk threads, 128 keep-alive connections, 10 s per route.

      - name: Run benchmarks (3 backends + nginx)
        run: |
          set -uo pipefail
          cat > /tmp/post_echo.lua << 'LUA'
          wrk.method = "POST"
          wrk.body = "hello"
          wrk.headers["Content-Type"] = "application/octet-stream"
          LUA

          bench() {   # url [luascript] -> integer RPS on stdout
            if [ -n "${2:-}" ]; then
              wrk -t8 -c128 -d10s -s "$2" "$1" 2>/dev/null
            else
              wrk -t8 -c128 -d10s "$1" 2>/dev/null
            fi | awk '/Requests\/sec:/ {print int($2); exit}'
          }

          : > /tmp/results.tsv
          record() { printf '%s\t%s\n' "$1" "${2:-0}" >> /tmp/results.tsv; }

          run_backend() {   # label backend port
            local label=$1 backend=$2 port=$3
            LEAN_NUM_THREADS=256 LEANTEA_HTTP_BACKEND="$backend" \
              ./.lake/build/bin/bench_server --port "$port" > "/tmp/lean_$label.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 40); do
              curl -sf "http://127.0.0.1:$port/health" >/dev/null && break; sleep 0.3
            done
            if ! curl -sf "http://127.0.0.1:$port/health" >/dev/null; then
              echo "!! $label did not come up"; cat "/tmp/lean_$label.log" || true
            else
              record "lean-tea $label /health" "$(bench http://127.0.0.1:$port/health)"
              record "lean-tea $label /json"   "$(bench http://127.0.0.1:$port/json)"
              record "lean-tea $label /echo"   "$(bench http://127.0.0.1:$port/echo /tmp/post_echo.lua)"
            fi
            kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
          }

          NPROC=$(nproc)
          run_backend libuv   libuv              8091
          run_backend fast    "fast:$NPROC"      8092
          run_backend reactor "reactor:$NPROC"   8090

          # nginx (no /echo endpoint configured)
          record "nginx /health" "$(bench http://127.0.0.1:9090/health)"
          record "nginx /json"   "$(bench http://127.0.0.1:9090/json)"

          echo "--- results.tsv ---"; cat /tmp/results.tsv

          # customBiggerIsBetter expects [{name, unit, value}]. Drop any
          # zero (a backend that failed to bind) so it doesn't poison the
          # chart / alert history.
          python3 - > http-bench-results.json <<'PYEOF'
          import json
          rows = []
          for line in open('/tmp/results.tsv'):
              name, _, val = line.rstrip('\n').partition('\t')
              try: v = int(val)
              except ValueError: v = 0
              if v > 0:
                  rows.append({"name": name, "unit": "RPS", "value": v})
          print(json.dumps(rows, indent=2))
          PYEOF
          echo "--- http-bench-results.json ---"; cat http-bench-results.json

      # ---- Persist + regression-alert ----
      #
      # `benchmark-action/github-action-benchmark@v1` with
      # `external-data-json-path` appends this run's entries to a
      # local JSON file and compares each against history.
      # `alert-threshold: 80%` means: if the current RPS drops below
      # 80% of the previous best, the step logs a warning. Set
      # `fail-on-alert: true` once the numbers stabilise.

      # Publish the history + trend chart to the `gh-pages` branch (NOT
      # main) under `bench/`. This keeps the JSON out of main's history
      # — the pages workflow copies `bench/` from gh-pages into the
      # deployed docs site, so the live chart shows up at
      # `<pages-url>/bench/`.
      - name: Publish benchmark to gh-pages
        uses: benchmark-action/github-action-benchmark@v1
        if: github.event_name == 'push'
        with:
          name: HTTP throughput (lean-tea backends vs nginx)
          tool: customBiggerIsBetter
          output-file-path: http-bench-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          auto-push: true
          alert-threshold: "80%"
          fail-on-alert: false

      # ---- Teardown ----

      - name: Dump server logs
        if: always()
        run: |
          # Each backend is killed inline after its runs; this just
          # surfaces logs if a backend failed to bind.
          pkill -f bench_server 2>/dev/null || true
          for f in /tmp/lean_*.log; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
          done || echo "(no logs)"
